name: Update Claude Code

# Follow Anthropic's "latest" channel. A new sources.json is committed only
# after the new release downloads, verifies and runs on x86_64-linux.
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Fetch the newest release's checksums
        id: update
        run: |
          ./update.sh latest
          if git diff --quiet -- sources.json; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
          else
            echo "changed=true" >>"$GITHUB_OUTPUT"
            echo "version=$(jq -r .version sources.json)" >>"$GITHUB_OUTPUT"
          fi
      - name: Build and test the new release
        if: steps.update.outputs.changed == 'true'
        run: nix flake check --print-build-logs
      - name: Commit
        if: steps.update.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.update.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Claude Code $VERSION" -- sources.json
          git push
