name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Check formatting and update script
        run: |
          nix fmt -- --check flake.nix package.nix
          bash -n update.sh
      # Downloads the pinned release, verifies its checksum, patches it and
      # runs `claude --version` as the package's install check.
      - name: Build and test
        run: nix flake check --print-build-logs
